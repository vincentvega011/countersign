<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="referrer" content="no-referrer" />
    <title>Countersign: approve a purchase</title>
    <link rel="stylesheet" href="../ui/fonts.css" />
    <link rel="stylesheet" href="../ui/tokens.css" />
    <link rel="stylesheet" href="../ui/components.css" />
    <link rel="stylesheet" href="approve.css" />
  </head>
  <body class="cs-scope">
    <div class="ts">
      <header class="ts__head">
        <span class="ts__brand">Countersign</span>
        <span class="ts__where">Trusted Surface</span>
      </header>
      <main class="ts__main">
        <h1 class="ts__title">Approve a purchase</h1>
        <p class="ts__lead cs-muted">
          You are about to approve one purchase, exactly as the store signed it.
        </p>
        <div id="app" aria-live="polite"></div>
      </main>
      <footer class="ts__foot cs-muted">
        Your approval is signed on this device. The private key never leaves it.
      </footer>
    </div>
    <noscript>
      <p class="ts__noscript">
        This page needs JavaScript to sign an approval.
      </p>
    </noscript>
    <script type="module" src="purchase.js"></script>
  </body>
</html>
