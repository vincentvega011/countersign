[project]
name = "countersign"
version = "0.0.0"
description = "AP2 mandate verification and capture gate for PayPal merchants (sandbox only)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"
# No third-party SD-JWT library: mandates are built on joserfc and hashlib (docs/ENV.md).
dependencies = [
  "fastapi",
  "uvicorn",
  "pydantic>=2",
  "sqlalchemy>=2",
  "alembic",
  "psycopg[binary]>=3",
  "httpx",
  "rfc8785==0.1.4",
  "joserfc==1.7.5",
  "structlog",
  "slowapi",
  "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest",
    "hypothesis",
    "respx",
    "ruff",
    "mypy",
    "cryptography",
    "types-pyyaml>=6.0.12.20260906",
    "jsonschema>=4.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/countersign"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"

[[tool.mypy.overrides]]
module = [
  "countersign.merchant.*", "countersign.cp.*", "countersign.mpp.*", "countersign.gate.*",
  "countersign.lock.*", "countersign.constraints.*", "countersign.canonical.*",
  "countersign.ledger.*", "countersign.evidence.*", "countersign.mandates.*",
  "countersign.protocols.acp.*", "countersign.webhooks.*",
  "countersign.protocols.ucp.*", "countersign.paypal.*", "countersign.degraded.*",
  "countersign.checkout.*", "countersign.completion", "countersign.composition",
  "countersign.runtime", "countersign.ablations",
]
strict = true
