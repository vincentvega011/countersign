name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg://countersign:countersign@localhost:5432/countersign
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: countersign
          POSTGRES_PASSWORD: countersign
          POSTGRES_DB: countersign
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U countersign -d countersign"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      # The interop tests run scripts/interop_verify.mjs, which resolves jose and canonicalize from the
      # root node_modules, so the Node packages must be installed before pytest.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The Trusted Surface browser tests (tests/integration/test_approve_browser.py) drive a real
      # Chromium and fail, on purpose, when it is missing. The browser download is cached by the
      # lockfile (it pins the Playwright version); the system libraries are installed every run.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm --filter @countersign/approve exec playwright install --with-deps chromium
      # The dashboard tests serve the built dashboard (web/dashboard/dist). CI builds it WITHOUT the AG
      # Studio licence key (it is never in the repository); Studio then shows its trial watermark and
      # the tests skip only the licence assertion.
      - run: pnpm --filter @countersign/dashboard run build
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Packages without a lint or build script are skipped by pnpm, so empty packages pass.
      - run: pnpm -r --if-present run lint
      - run: pnpm -r --if-present run build

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/secret_scan.sh
